# Local development database only. Production uses a managed PostgreSQL (see docs/deployment.md).
services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: hknr
      POSTGRES_PASSWORD: hknr_local_dev
      POSTGRES_DB: hknr
    ports:
      - "127.0.0.1:55433:5432"
    volumes:
      - hknr-pg:/var/lib/postgresql/data
      - ./scripts/docker-init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hknr -d hknr"]
      interval: 2s
      timeout: 3s
      retries: 20
volumes:
  hknr-pg:
